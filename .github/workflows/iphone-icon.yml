name: Generate iPhone PNG icon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/icon.webp'
      - '.github/workflows/iphone-icon.yml'
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Convert icon for iPhone
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open('assets/icon.webp').convert('RGBA')
          im = im.resize((180,180), Image.Resampling.LANCZOS)
          im.save('assets/apple-touch-icon.png', optimize=True)
          PY
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate iPhone-compatible PNG app icon"
            git push
          fi
